name: C++ CI/CD Pipeline

on:
  push:
    branches: [ "main", "lab1-work" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # BUILD POSTMACHINE (Release Config)
    # ---------------------------------------------------------
    - name: Configure PostMachine
      working-directory: ${{ github.workspace }}/Lab1/PostMachine
      run: cmake -B build -S .

    - name: Build PostMachine
      working-directory: ${{ github.workspace }}/Lab1/PostMachine
      run: cmake --build build --config Release

    - name: Run PostMachine Tests
      working-directory: ${{ github.workspace }}/Lab1/PostMachine/build
      run: ctest -C Release --output-on-failure

    # ---------------------------------------------------------
    # BUILD VECTOR (Release Config)
    # ---------------------------------------------------------
    - name: Configure Vector
      working-directory: ${{ github.workspace }}/Lab1/vector
      run: cmake -B build -S .

    - name: Build Vector
      working-directory: ${{ github.workspace }}/Lab1/vector
      run: cmake --build build --config Release

    - name: Run Vector Tests
      working-directory: ${{ github.workspace }}/Lab1/vector/build
      run: ctest -C Release --output-on-failure

    # ---------------------------------------------------------
    # COVERAGE CHECK (Using OpenCppCoverage)
    # ---------------------------------------------------------
    - name: Install OpenCppCoverage
      run: choco install opencppcoverage -y

    - name: Run Vector Tests with Coverage
      working-directory: ${{ github.workspace }}/Lab1/vector/build
      run: |
        $env:PATH += ";C:\Program Files\OpenCppCoverage"
        OpenCppCoverage.exe --sources "${{ github.workspace }}\Lab1\vector\src" --export_type cobertura:coverage.xml -- .\Release\VectorTests.exe

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: Coverage-Report
        path: ${{ github.workspace }}/Lab1/vector/build/coverage.xml

    # ---------------------------------------------------------
    # PACKAGE EXECUTABLES INTO A ZIP FOLDER
    # ---------------------------------------------------------
    - name: Package Executables into Folder and Zip
      run: |
        mkdir Lab1-Release
        # Copy the Release executables
        Copy-Item -Path "${{ github.workspace }}\Lab1\PostMachine\build\Release\PostMachineApp.exe" -Destination "Lab1-Release/" -ErrorAction SilentlyContinue
        Copy-Item -Path "${{ github.workspace }}\Lab1\vector\build\Release\VectorApp.exe" -Destination "Lab1-Release/" -ErrorAction SilentlyContinue
        
        # Copy the standard Release C++ Runtime DLLs
        Copy-Item -Path "C:\Windows\System32\msvcp140.dll" -Destination "Lab1-Release/" -ErrorAction SilentlyContinue
        Copy-Item -Path "C:\Windows\System32\vcruntime140.dll" -Destination "Lab1-Release/" -ErrorAction SilentlyContinue
        Copy-Item -Path "C:\Windows\System32\vcruntime140_1.dll" -Destination "Lab1-Release/" -ErrorAction SilentlyContinue
        
        # Zip the folder
        Compress-Archive -Path "Lab1-Release" -DestinationPath "Lab1-Release.zip"

    # ---------------------------------------------------------
    # CREATE GITHUB RELEASE WITH ZIP FILE
    # ---------------------------------------------------------
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Lab1 Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: Lab1-Release.zip