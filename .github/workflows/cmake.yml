name: C++ CI/CD Pipeline

on:
  push:
    branches: [ "main", "lab1-work" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # CONFIGURE & BUILD
    # ---------------------------------------------------------
    - name: Configure PostMachine
      working-directory: ${{ github.workspace }}/Lab1/PostMachine
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Configure Vector
      working-directory: ${{ github.workspace }}/Lab1/vector
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build PostMachine
      working-directory: ${{ github.workspace }}/Lab1/PostMachine
      run: cmake --build build --config Release

    - name: Build Vector
      working-directory: ${{ github.workspace }}/Lab1/vector
      run: cmake --build build --config Release

    # ---------------------------------------------------------
    # RUN TESTS
    # ---------------------------------------------------------
    - name: Run PostMachine Tests
      working-directory: ${{ github.workspace }}/Lab1/PostMachine/build
      run: ctest -C Release --output-on-failure

    - name: Run Vector Tests
      working-directory: ${{ github.workspace }}/Lab1/vector/build
      run: ctest -C Release --output-on-failure

    # ---------------------------------------------------------
    # COVERAGE (Both Projects)
    # ---------------------------------------------------------
    - name: Install OpenCppCoverage
      run: choco install opencppcoverage -y

    - name: Run Vector Coverage
      working-directory: ${{ github.workspace }}/Lab1/vector/build
      run: |
        $env:PATH += ";C:\Program Files\OpenCppCoverage"
        OpenCppCoverage.exe --sources "${{ github.workspace }}\Lab1\vector\src" --export_type cobertura:coverage_vector.xml -- .\Release\VectorTests.exe

    - name: Run PostMachine Coverage
      working-directory: ${{ github.workspace }}/Lab1/PostMachine/build
      run: |
        $env:PATH += ";C:\Program Files\OpenCppCoverage"
        OpenCppCoverage.exe --sources "${{ github.workspace }}\Lab1\PostMachine\src" --sources "${{ github.workspace }}\Lab1\PostMachine\include" --export_type cobertura:coverage_postmachine.xml -- .\Release\PostMachineTests.exe

    - name: Upload Coverage Reports
      uses: actions/upload-artifact@v4
      with:
        name: Coverage-Reports
        path: |
          ${{ github.workspace }}/Lab1/vector/build/coverage_vector.xml
          ${{ github.workspace }}/Lab1/PostMachine/build/coverage_postmachine.xml

    # ---------------------------------------------------------
    # PACKAGE ARTIFACTS & RELEASE
    # ---------------------------------------------------------
    - name: Package Executables
      run: |
        mkdir Lab1-Release-Windows
        Copy-Item -Path "${{ github.workspace }}\Lab1\PostMachine\build\Release\PostMachineApp.exe" -Destination "Lab1-Release-Windows/" -ErrorAction SilentlyContinue
        Copy-Item -Path "${{ github.workspace }}\Lab1\vector\build\Release\VectorApp.exe" -Destination "Lab1-Release-Windows/" -ErrorAction SilentlyContinue
        Compress-Archive -Path "Lab1-Release-Windows" -DestinationPath "Lab1-Release-Windows.zip"

    - name: Upload Release Artifact
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Lab1 Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: Lab1-Release-Windows.zip