name: C++ CI/CD Pipeline

on:
  push:
    branches: [ "main", "lab1-work" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # BUILD POSTMACHINE
    # ---------------------------------------------------------
    - name: Configure PostMachine
      working-directory: ${{ github.workspace }}/Lab1/PostMachine
      run: cmake -B build -S .

    - name: Build PostMachine
      working-directory: ${{ github.workspace }}/Lab1/PostMachine
      run: cmake --build build --config Debug

    - name: Run PostMachine Tests
      working-directory: ${{ github.workspace }}/Lab1/PostMachine/build
      run: ctest -C Debug --output-on-failure

    # ---------------------------------------------------------
    # BUILD VECTOR
    # ---------------------------------------------------------
    - name: Configure Vector
      working-directory: ${{ github.workspace }}/Lab1/vector
      run: cmake -B build -S .

    - name: Build Vector
      working-directory: ${{ github.workspace }}/Lab1/vector
      run: cmake --build build --config Debug

    - name: Run Vector Tests
      working-directory: ${{ github.workspace }}/Lab1/vector/build
      run: ctest -C Debug --output-on-failure

    # ---------------------------------------------------------
    # COVERAGE CHECK (Using OpenCppCoverage)
    # ---------------------------------------------------------
    - name: Install OpenCppCoverage
      run: choco install opencppcoverage -y

    - name: Run Vector Tests with Coverage
      working-directory: ${{ github.workspace }}/Lab1/vector/build
      run: |
        $env:PATH += ";C:\Program Files\OpenCppCoverage"
        OpenCppCoverage.exe --sources "${{ github.workspace }}\Lab1\vector\src" --export_type cobertura:coverage.xml -- .\Debug\VectorTests.exe

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: Coverage-Report
        path: ${{ github.workspace }}/Lab1/vector/build/coverage.xml

    # ---------------------------------------------------------
    # RELEASE ARTIFACT
    # ---------------------------------------------------------
    - name: Package Executables
      run: |
        mkdir release_artifacts
        Copy-Item -Path "${{ github.workspace }}\Lab1\PostMachine\build\Debug\PostMachineApp.exe" -Destination "release_artifacts/" -ErrorAction SilentlyContinue
        Copy-Item -Path "${{ github.workspace }}\Lab1\vector\build\Debug\VectorApp.exe" -Destination "release_artifacts/" -ErrorAction SilentlyContinue

    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Lab1-Executables
        path: release_artifacts/