name: C++ CI/CD Pipeline

on:
  push:
    branches: [ "main", "lab1-work" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: Lab1-Release-Windows
            executable_path: "Lab1/PostMachine/build/Release/PostMachineApp.exe;Lab1/vector/build/Release/VectorApp.exe"
            build_type: Release
          - os: ubuntu-latest
            artifact_name: Lab1-Release-Linux
            executable_path: "Lab1/PostMachine/build/PostMachineApp;Lab1/vector/build/VectorApp"
            build_type: Release

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ---------------------------------------------------------
    # WINDOWS SPECIFIC SETUP (Static Runtime)
    # ---------------------------------------------------------
    - name: Configure PostMachine (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ${{ github.workspace }}/Lab1/PostMachine
      run: cmake -B build -S . -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>"

    - name: Configure Vector (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ${{ github.workspace }}/Lab1/vector
      run: cmake -B build -S . -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>"

    # ---------------------------------------------------------
    # LINUX SPECIFIC SETUP (Standard Build)
    # ---------------------------------------------------------
    - name: Configure PostMachine (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: ${{ github.workspace }}/Lab1/PostMachine
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    - name: Configure Vector (Linux)
      if: matrix.os == 'ubuntu-latest'
      working-directory: ${{ github.workspace }}/Lab1/vector
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

    # ---------------------------------------------------------
    # BUILD AND TEST (Runs on both OS)
    # ---------------------------------------------------------
    - name: Build PostMachine
      working-directory: ${{ github.workspace }}/Lab1/PostMachine
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run PostMachine Tests
      working-directory: ${{ github.workspace }}/Lab1/PostMachine/build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

    - name: Build Vector
      working-directory: ${{ github.workspace }}/Lab1/vector
      run: cmake --build build --config ${{ matrix.build_type }}

    - name: Run Vector Tests
      working-directory: ${{ github.workspace }}/Lab1/vector/build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure

    # ---------------------------------------------------------
    # PACKAGE ARTIFACTS (Dynamic based on OS)
    # ---------------------------------------------------------
    - name: Package Executables (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        mkdir ${{ matrix.artifact_name }}
        Copy-Item -Path "${{ github.workspace }}\Lab1\PostMachine\build\Release\PostMachineApp.exe" -Destination "${{ matrix.artifact_name }}/" -ErrorAction SilentlyContinue
        Copy-Item -Path "${{ github.workspace }}\Lab1\vector\build\Release\VectorApp.exe" -Destination "${{ matrix.artifact_name }}/" -ErrorAction SilentlyContinue
        Compress-Archive -Path "${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.artifact_name }}.zip"

    - name: Package Executables (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        mkdir ${{ matrix.artifact_name }}
        cp "Lab1/PostMachine/build/PostMachineApp" "${{ matrix.artifact_name }}/" || true
        cp "Lab1/vector/build/VectorApp" "${{ matrix.artifact_name }}/" || true
        chmod +x "${{ matrix.artifact_name }}"/*
        tar -czvf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"

    # ---------------------------------------------------------
    # UPLOAD TO RELEASE (Both OS)
    # ---------------------------------------------------------
    - name: Upload Release Artifacts
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Lab1 Release v1.0.${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          ${{ matrix.artifact_name }}.zip
          ${{ matrix.artifact_name }}.tar.gz